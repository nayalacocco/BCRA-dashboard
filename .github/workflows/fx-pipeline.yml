name: Tipo de cambio pipeline

# Reservas, encajes y depósitos del Tesoro (BCRA) se publican con 1–2 días hábiles de rezago;
# cotizaciones y banda, en el día. Se corre dos veces por día hábil: 10:40 y 19:10 ART
# (13:40 / 22:10 UTC). La planilla NEDD-FMI es mensual: se relee entera en cada corrida.

on:
  schedule:
    - cron: "40 13 * * 1-5"
    - cron: "10 22 * * 1-5"
  workflow_dispatch:
  pull_request:
    paths: ["pipeline/fx/**", "pipeline/tests/test_fx.py", ".github/workflows/fx-pipeline.yml"]

permissions:
  contents: write

concurrency:
  group: fx-pipeline
  cancel-in-progress: false

jobs:
  fx:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests (fixtures reales de la planilla + perímetros)
        run: python -m pytest -q tests/test_fx.py
      - name: Pipeline (descarga, valida, exporta)
        run: python -m fx.run --out ../data/fx
      - name: Commit si cambió (main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: .
        run: |
          CHANGES=$(git status --porcelain -- data/fx | grep -v 'manifest.json' || true)
          if [ -z "$CHANGES" ]; then echo "Sin datos nuevos"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fx
          git commit -m "chore(data): tipo de cambio y reservas $(date -u +%F)"
          git pull --rebase && git push
      - name: Commit a la rama del PR
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fx
          CHANGES=$(git status --porcelain -- data/fx | grep -v 'manifest.json' || true)
          [ -z "$CHANGES" ] && { echo "Sin cambios"; exit 0; }
          git commit -m "chore(data): tipo de cambio y reservas (generado en PR) [skip vercel]"
          git push origin HEAD:"${{ github.head_ref }}"
