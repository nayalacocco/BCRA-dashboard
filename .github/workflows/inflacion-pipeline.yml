name: Inflación pipeline

# Refresco alineado con INDEC: el IPC se publica ~16:00 ART. Se corre todos los días hábiles a las
# 16:40 y 18:40 ART (19:40 / 21:40 UTC); si no hay período nuevo, no hay cambios y no se commitea.
# Bonos: foto diaria al cierre (18:15 ART = 21:15 UTC).

on:
  schedule:
    - cron: "40 19,21 * * 1-5"
    - cron: "15 21 * * 1-5"
  workflow_dispatch:
  pull_request:
    paths: ["pipeline/**", ".github/workflows/inflacion-pipeline.yml"]

permissions:
  contents: write

concurrency:
  group: inflacion-pipeline
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests (paneles sintéticos)
        run: python -m pytest -q tests

  inflacion:
    needs: test
    if: github.event_name != 'schedule' || github.event.schedule == '40 19,21 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pipeline INDEC (descarga, valida, exporta)
        run: python -m inflacion.run --out ../data/inflacion
      - name: Commit si cambió (solo en main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: .
        run: |
          # manifest.json cambia siempre (timestamp): solo se commitea si cambió algún dato
          CHANGES=$(git status --porcelain -- data/inflacion | grep -v 'manifest.json' || true)
          if [ -z "$CHANGES" ]; then
            echo "Sin datos nuevos"; git checkout -- data/inflacion 2>/dev/null || true; exit 0
          fi
          PER=$(python -c "import json;print(json.load(open('data/inflacion/manifest.json'))['ultimo_periodo'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inflacion
          git commit -m "chore(data): inflación INDEC ${PER}"
          git pull --rebase && git push
      - name: Artefacto (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: inflacion-data
          path: data/inflacion

  bonos:
    needs: test
    if: github.event_name != 'schedule' || github.event.schedule == '15 21 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Foto de bonos en pesos (ByMA)
        run: python -m inflacion.byma_snapshot --out ../data/bonos
      - name: Commit (solo en main, sin redeploy)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bonos
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): foto bonos ARS $(date -u +%F) [skip vercel]"
          git pull --rebase && git push
